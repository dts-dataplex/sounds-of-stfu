version: '3.8'

services:
  # Go Backend Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - livekit
    networks:
      - chatsubo

  # LiveKit SFU Server
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"   # WebSocket/HTTP API
      - "7881:7881"   # WebRTC TCP
      - "50000-50100:50000-50100/udp"  # WebRTC UDP range
    command: --config /etc/livekit.yaml --dev
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - chatsubo

networks:
  chatsubo:
    driver: bridge
