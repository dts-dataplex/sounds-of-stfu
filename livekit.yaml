# LiveKit Server Configuration
# For local development - NOT for production use

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  tcp_port: 7881
  # For Docker: advertise localhost so browser can reach WebRTC ports
  node_ip: 127.0.0.1

# Development keys - CHANGE FOR PRODUCTION
keys:
  devkey: secret

# Logging
logging:
  level: info
  pion_level: warn

# Room settings
room:
  auto_create: true
  empty_timeout: 300  # 5 minutes
  max_participants: 50

# Audio settings
# Note: Spatial audio mixing is handled by the Go backend, not LiveKit config
